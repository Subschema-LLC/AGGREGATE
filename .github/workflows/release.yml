name: Publish release

# Run from the Actions tab on the publishing branch (config/release.yaml, normally
# master). The run chooses the next version, then builds, tests, signs and verifies
# the package from the branch's newest commit. Only then does it tag that commit
# and publish the release, so a failed run leaves no tag or release behind and can
# simply be run again.
on:
  workflow_dispatch:
    inputs:
      kind:
        description: 'release: the next vYYYY.MM.NN for this UTC month. hotfix: the next vYYYY.MM.NN.H of the latest release.'
        type: choice
        options: [release, hotfix]
        default: release
      label:
        description: 'Shown before the version in the release title, for example "Beta v2026.11.05"'
        type: choice
        options: [Beta, none]
        default: Beta

permissions:
  contents: read

# One release at a time, so two runs never choose the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      branch: ${{ steps.release.outputs.branch }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      # The commit the run started from, even if the branch moves during the run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.2'
          extensions: ctype, iconv, pdo_sqlite, pdo_mysql, mbstring, xml, curl, intl, sodium, zip
          coverage: none
          tools: composer:v2
      # No dependency cache: a signed release never restores an Actions cache
      # that another workflow run could have written.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          echo "RELEASE_OUTPUT=$RUNNER_TEMP/aggregate-release" >> "$GITHUB_ENV"
          cp .env.prod.example .env
          composer validate --strict --no-check-publish --no-plugins --no-interaction
          composer install --no-interaction --prefer-dist --no-scripts
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Install UI JavaScript test dependencies
        run: php bin/console importmap:install --env=test --no-debug --no-interaction
      - name: Audit locked build and runtime dependencies
        run: |
          composer audit --locked --no-plugins --no-interaction
          npm audit
      - name: Choose the release version
        id: release
        shell: bash
        env:
          RELEASE_KIND: ${{ inputs.kind }}
        run: |
          set -euo pipefail
          branch="$(php scripts/release-branch.php)"
          if [ "$GITHUB_REF" != "refs/heads/$branch" ]; then
            echo "::error title=Wrong branch::Run this workflow on the publishing branch $branch (config/release.yaml), not $GITHUB_REF_NAME."
            exit 1
          fi
          commit="$(git rev-parse HEAD)"
          test "$commit" = "$GITHUB_SHA"
          released="$(git tag --points-at "$commit" --list 'v*' | paste -sd ' ' -)"
          if [ -n "$released" ]; then
            echo "::error title=Already released::$commit is already tagged $released. Promote new changes to $branch first."
            exit 1
          fi
          # vYYYY.MM.NN: NN numbers that month's releases from 01; it is not the day.
          # vYYYY.MM.NN.H: H numbers hotfixes to the latest release from 1.
          case "$RELEASE_KIND" in
            release) tag="$(python3 scripts/release-version.py next)" ;;
            hotfix) tag="$(python3 scripts/release-version.py next --hotfix)" ;;
            *) echo "::error::Unknown release kind: $RELEASE_KIND"; exit 1 ;;
          esac
          python3 scripts/release-version.py check "$tag" > /dev/null
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          printf 'tag=%s\nbranch=%s\ncommit=%s\n' "$tag" "$branch" "$commit" >> "$GITHUB_OUTPUT"
          echo "Building $tag ($RELEASE_KIND) from $branch at $commit." >> "$GITHUB_STEP_SUMMARY"
      - name: Test application and release tooling
        run: |
          php bin/phpunit
          npm run test:js
          python3 -m unittest discover -s tests/Release -p 'test_*.py' -v
      - name: Prepare production dependencies and browser assets
        env:
          APP_ENV: prod
          APP_DEBUG: '0'
          APP_SECRET: release-build-only-not-a-deployment-secret
        run: |
          # Fresh vendor directory prevents development packages surviving a build.
          rm -rf vendor src/DataFixtures
          composer install --no-dev --no-interaction --prefer-dist --no-scripts --optimize-autoloader
          composer check-platform-reqs --no-dev --no-plugins
          php bin/console importmap:install
          php bin/console assets:install public
          php bin/console asset-map:compile
          npm run build:js
          npm run check:js
      - name: Build installable ZIP and manifest
        env:
          RELEASE_BRANCH: ${{ steps.release.outputs.branch }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          python3 scripts/build-release.py --output-dir "$RELEASE_OUTPUT" --version "$RELEASE_TAG" --branch "$RELEASE_BRANCH" --commit "$RELEASE_COMMIT"
      - name: Smoke test packaged application without Git or build tools
        env:
          APP_ENV: prod
          APP_DEBUG: '0'
          APP_SECRET: release-smoke-test-only-not-a-deployment-secret
          DATABASE_URL: 'mysql://build:build@127.0.0.1:3306/aggregate?serverVersion=8.0.0'
        shell: bash
        run: |
          package="$RELEASE_OUTPUT/aggregate-${RELEASE_TAG#v}.zip"
          smoke="$RUNNER_TEMP/aggregate-release-smoke"
          python3 -m zipfile -e "$package" "$smoke"
          cd "$smoke"
          php bin/console about
          php bin/console cache:clear
          php bin/console lint:container
          DASHBOARD_ENABLED=0 php bin/console cache:clear
          DASHBOARD_ENABLED=0 php bin/console lint:container
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-release-package
          path: ${{ runner.temp }}/aggregate-release/*
          if-no-files-found: error
          retention-days: 7

  sign:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-signing
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
          sparse-checkout: |
            scripts/sign-release.php
            config/release-signing.pub
          sparse-checkout-cone-mode: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.2'
          extensions: sodium
          coverage: none
          tools: none
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-release-package
          path: release
      - name: Check release signing setup and sign release manifest
        env:
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
        run: |
          php scripts/sign-release.php --check-key config/release-signing.pub
          php scripts/sign-release.php release/aggregate-release.json config/release-signing.pub
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-release-package
          path: release/*
          if-no-files-found: error
          retention-days: 7
      # The verify job checks the package against this same trusted key, so it
      # never has to check out the release commit itself.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-trusted-key
          path: config/release-signing.pub
          if-no-files-found: error
          retention-days: 7

  verify:
    # Runs the packaged application's own verifier against the trusted key the
    # sign job used. Code from the package runs here, with a read-only token, no
    # secrets and no checkout, never in the job that can write releases.
    needs: [build, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-trusted-key
          path: trusted-key
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.2'
          extensions: ctype, iconv, pdo_sqlite, pdo_mysql, mbstring, xml, curl, intl, sodium, zip
          coverage: none
          tools: none
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-release-package
          path: release
      - name: Verify signed package using the application verifier
        env:
          APP_ENV: prod
          APP_DEBUG: '0'
          APP_SECRET: release-verification-only-not-a-deployment-secret
          DATABASE_URL: 'mysql://build:build@127.0.0.1:3306/aggregate?serverVersion=8.0.0'
          RELEASE_BRANCH: ${{ needs.build.outputs.branch }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          package="$PWD/release/aggregate-${RELEASE_TAG#v}.zip"
          manifest="$PWD/release/aggregate-release.json"
          signature="$PWD/release/aggregate-release.json.sig"
          trusted_key="$PWD/trusted-key/release-signing.pub"
          verifier="$RUNNER_TEMP/aggregate-release-verify"
          python3 -m zipfile -e "$package" "$verifier"
          cp "$trusted_key" "$verifier/config/release-signing.pub"
          cd "$verifier"
          php <<'PHP'
          <?php
          require 'vendor/autoload.php';
          $branch = App\Service\UpdateSettings::validateBranch(getenv('RELEASE_BRANCH'));
          $yaml = Symfony\Component\Yaml\Yaml::dump(['updates_branch' => $branch]);
          $handle = @fopen('config/aggregate_prod.yaml', 'xb');
          if ($handle === false || fwrite($handle, $yaml) !== strlen($yaml)) {
              throw new RuntimeException('Cannot create temporary verification configuration.');
          }
          fclose($handle);
          PHP
          php bin/console app:updates:verify-package "$package" "$manifest" "$signature"

  publish:
    needs: [build, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-release-package
          path: release
      - name: Tag the verified commit and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
          RELEASE_LABEL: ${{ inputs.label }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(release/aggregate-*.zip release/aggregate-release.json release/aggregate-release.json.sig)
          title="$RELEASE_TAG"
          if [ "$RELEASE_LABEL" = Beta ]; then
            title="Beta $RELEASE_TAG"
          fi

          # The tag is created only now, after the package was built, signed and
          # verified. A rerun of this job may find the tag it created; any other
          # tag of that name stops the release.
          existing="$(gh api "repos/$GH_REPO/git/matching-refs/tags/$RELEASE_TAG" \
            --jq '.[] | select(.ref == "refs/tags/" + env.RELEASE_TAG) | .object.sha')"
          if [ -z "$existing" ]; then
            gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$RELEASE_COMMIT" > /dev/null
          elif [ "$existing" != "$RELEASE_COMMIT" ]; then
            echo "::error title=Tag $RELEASE_TAG exists::It points to $existing, not $RELEASE_COMMIT. Run the workflow again to choose the next version."
            exit 1
          fi

          # Attach all three files to a draft first and publish it after, so an
          # installation never sees the release with only some of its files.
          find_release() {
            gh api "repos/$GH_REPO/releases?per_page=100" --paginate \
              --jq '.[] | select(.tag_name == env.RELEASE_TAG) | "\(.id) \(.draft) \(.assets | length)"'
          }
          release="$(find_release)"
          if [ -z "$release" ]; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$title" --generate-notes "${assets[@]}"
            release="$(find_release)"
          fi
          count="$(printf '%s\n' "$release" | grep -c . || true)"
          if [ "$count" -ne 1 ]; then
            echo "::error title=Release $RELEASE_TAG::Found $count releases for $RELEASE_TAG, not one. Delete any extra ones on GitHub (the tag stays), then rerun this job."
            exit 1
          fi
          read -r id draft attached <<< "$release"
          if [ "$attached" -ne 3 ]; then
            echo "::error title=Release $RELEASE_TAG::The release has $attached of its 3 files. Delete the release on GitHub (the tag stays), then rerun this job."
            exit 1
          fi
          if [ "$draft" = true ]; then
            gh api -X PATCH "repos/$GH_REPO/releases/$id" -F draft=false > /dev/null
          fi
          echo "Published $title with its package. Installations can update to it now." >> "$GITHUB_STEP_SUMMARY"
